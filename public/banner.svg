<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12"/>
      <stop offset="50%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Brand Accents -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="heat0" x1="0%" y1="0%" x2="100%" y2="100%"><stop stop-color="#1e293b"/></linearGradient>
    <linearGradient id="heat1" x1="0%" y1="0%" x2="100%" y2="100%"><stop stop-color="#065f46"/></linearGradient>
    <linearGradient id="heat2" x1="0%" y1="0%" x2="100%" y2="100%"><stop stop-color="#059669"/></linearGradient>
    <linearGradient id="heat3" x1="0%" y1="0%" x2="100%" y2="100%"><stop stop-color="#10b981"/></linearGradient>
    <linearGradient id="heat4" x1="0%" y1="0%" x2="100%" y2="100%"><stop stop-color="#34d399"/></linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.3"/>
    </pattern>

    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" fill="url(#bgGrad)"/>
  <rect width="1200" height="360" fill="url(#grid)"/>

  <!-- Ambient Glow Circles -->
  <circle cx="200" cy="180" r="160" fill="url(#glowGrad)" filter="url(#blurFilter)"/>
  <circle cx="1000" cy="120" r="140" fill="#06b6d4" fill-opacity="0.12" filter="url(#blurFilter)"/>

  <!-- Left: Content & Branding -->
  <g transform="translate(80, 75)">
    <!-- Tech Badge -->
    <rect x="0" y="0" width="220" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="15" cy="15" r="4" fill="#00dc82"/>
    <text x="28" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" letter-spacing="1">NUXT 4 • VUE 3 • TAILWIND 4</text>

    <!-- Project Title -->
    <text x="0" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" fill="#ffffff" letter-spacing="-1">
      MOMENTUM
    </text>

    <!-- Tagline -->
    <text x="0" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400" fill="#94a3b8">
      Build consistency, not motivation. High-performance habit tracker.
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 155)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="155" height="32" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="14" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#cbd5e1">⚡ 0ms Optimistic UI</text>

      <!-- Pill 2 -->
      <rect x="165" y="0" width="165" height="32" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="179" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#cbd5e1">📊 365-Day Heatmap</text>

      <!-- Pill 3 -->
      <rect x="340" y="0" width="155" height="32" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="354" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#cbd5e1">🤖 Multi-Model AI</text>
    </g>
  </g>

  <!-- Right: Decorative Isometric Contribution Heatmap Graphic -->
  <g transform="translate(820, 85)">
    <!-- Heatmap Card Frame -->
    <rect x="-20" y="-15" width="340" height="220" rx="20" fill="#0f172a" fill-opacity="0.8" stroke="#334155" stroke-width="1.5"/>

    <!-- Card Header -->
    <text x="0" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">Consistency Stream</text>
    <text x="210" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#10b981">14-Day Streak 🔥</text>

    <!-- Heatmap Matrix -->
    <g transform="translate(0, 36)">
      <!-- Week 1 -->
      <rect x="0" y="0" width="22" height="22" rx="5" fill="url(#heat0)"/>
      <rect x="0" y="28" width="22" height="22" rx="5" fill="url(#heat2)"/>
      <rect x="0" y="56" width="22" height="22" rx="5" fill="url(#heat3)"/>
      <rect x="0" y="84" width="22" height="22" rx="5" fill="url(#heat4)"/>
      <rect x="0" y="112" width="22" height="22" rx="5" fill="url(#heat1)"/>

      <!-- Week 2 -->
      <rect x="28" y="0" width="22" height="22" rx="5" fill="url(#heat1)"/>
      <rect x="28" y="28" width="22" height="22" rx="5" fill="url(#heat3)"/>
      <rect x="28" y="56" width="22" height="22" rx="5" fill="url(#heat4)"/>
      <rect x="28" y="84" width="22" height="22" rx="5" fill="url(#heat2)"/>
      <rect x="28" y="112" width="22" height="22" rx="5" fill="url(#heat3)"/>

      <!-- Week 3 -->
      <rect x="56" y="0" width="22" height="22" rx="5" fill="url(#heat4)"/>
      <rect x="56" y="28" width="22" height="22" rx="5" fill="url(#heat4)"/>
      <rect x="56" y="56" width="22" height="22" rx="5" fill="url(#heat3)"/>
      <rect x="56" y="84" width="22" height="22" rx="5" fill="url(#heat4)"/>
      <rect x="56" y="112" width="22" height="22" rx="5" fill="url(#heat4)"/>

      <!-- Week 4 -->
      <rect x="84" y="0" width="22" height="22" rx="5" fill="url(#heat2)"/>
      <rect x="84" y="28" width="22" height="22" rx="5" fill="url(#heat4)"/>
      <rect x="84" y="56" width="22" height="22" rx="5" fill="url(#heat3)"/>
      <rect x="84" y="84" width="22" height="22" rx="5" fill="url(#heat4)"/>
      <rect x="84" y="112" width="22" height="22" rx="5" fill="url(#heat2)"/>

      <!-- Week 5 -->
      <rect x="112" y="0" width="22" height="22" rx="5" fill="url(#heat3)"/>
      <rect x="112" y="28" width="22" height="22" rx="5" fill="url(#heat4)"/>
      <rect x="112" y="56" width="22" height="22" rx="5" fill="url(#heat4)"/>
      <rect x="112" y="84" width="22" height="22" rx="5" fill="url(#heat3)"/>
      <rect x="112" y="112" width="22" height="22" rx="5" fill="url(#heat4)"/>

      <!-- Week 6 -->
      <rect x="140" y="0" width="22" height="22" rx="5" fill="url(#heat4)"/>
      <rect x="140" y="28" width="22" height="22" rx="5" fill="url(#heat3)"/>
      <rect x="140" y="56" width="22" height="22" rx="5" fill="url(#heat4)"/>
      <rect x="140" y="84" width="22" height="22" rx="5" fill="url(#heat4)"/>
      <rect x="140" y="112" width="22" height="22" rx="5" fill="url(#heat4)"/>

      <!-- Week 7 -->
      <rect x="168" y="0" width="22" height="22" rx="5" fill="url(#heat2)"/>
      <rect x="168" y="28" width="22" height="22" rx="5" fill="url(#heat4)"/>
      <rect x="168" y="56" width="22" height="22" rx="5" fill="url(#heat3)"/>
      <rect x="168" y="84" width="22" height="22" rx="5" fill="url(#heat4)"/>
      <rect x="168" y="112" width="22" height="22" rx="5" fill="url(#heat4)"/>

      <!-- Week 8 -->
      <rect x="196" y="0" width="22" height="22" rx="5" fill="url(#heat4)"/>
      <rect x="196" y="28" width="22" height="22" rx="5" fill="url(#heat4)"/>
      <rect x="196" y="56" width="22" height="22" rx="5" fill="url(#heat4)"/>
      <rect x="196" y="84" width="22" height="22" rx="5" fill="url(#heat3)"/>
      <rect x="196" y="112" width="22" height="22" rx="5" fill="url(#heat4)"/>

      <!-- Week 9 -->
      <rect x="224" y="0" width="22" height="22" rx="5" fill="url(#heat3)"/>
      <rect x="224" y="28" width="22" height="22" rx="5" fill="url(#heat4)"/>
      <rect x="224" y="56" width="22" height="22" rx="5" fill="url(#heat4)"/>
      <rect x="224" y="84" width="22" height="22" rx="5" fill="url(#heat4)"/>
      <rect x="224" y="112" width="22" height="22" rx="5" fill="url(#heat3)"/>

      <!-- Week 10 -->
      <rect x="252" y="0" width="22" height="22" rx="5" fill="url(#heat4)"/>
      <rect x="252" y="28" width="22" height="22" rx="5" fill="url(#heat4)"/>
      <rect x="252" y="56" width="22" height="22" rx="5" fill="url(#heat4)"/>
      <rect x="252" y="84" width="22" height="22" rx="5" fill="url(#heat4)"/>
      <rect x="252" y="112" width="22" height="22" rx="5" fill="url(#heat4)"/>

      <!-- Week 11 -->
      <rect x="280" y="0" width="22" height="22" rx="5" fill="url(#heat4)"/>
      <rect x="280" y="28" width="22" height="22" rx="5" fill="url(#heat4)"/>
      <rect x="280" y="56" width="22" height="22" rx="5" fill="url(#heat4)"/>
      <rect x="280" y="84" width="22" height="22" rx="5" fill="url(#heat4)"/>
      <rect x="280" y="112" width="22" height="22" rx="5" fill="url(#heat4)"/>
    </g>
  </g>
</svg>
